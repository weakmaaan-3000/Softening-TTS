name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Inspect iOS project
        run: |
          echo "=== Workspaces ==="
          find ios -maxdepth 1 -name "*.xcworkspace" -print
          echo "=== Projects ==="
          find ios -maxdepth 1 -name "*.xcodeproj" -print
          echo "=== Schemes ==="
          xcodebuild -list -workspace "$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)"

      - name: Build unsigned app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" \
            | awk '/Schemes:/{flag=1; next} flag && NF {gsub(/^[ \t]+/, ""); print; exit}')

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -print -quit)

          echo "App: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r weak-app-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: weak-app-unsigned
          path: weak-app-unsigned.ipa